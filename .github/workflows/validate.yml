name: Validate source and native Windows image generation
on:
  push:
    branches: [main, origin0-release, origin0-concept-studio]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - run: python3 build.py --target linux
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check web/app.js && node --check web/generator.js && node --check web/evolution.js && node --check web/concepts.js && node --check web/privacy.js && node --check web/studio_tools.js
      - run: python3 -m unittest discover -s worker
      - name: Install isolated browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise Concept Studio in Chromium
        run: python3 scripts/verify_concept_browser.py --binary release/origin0-linux-amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: origin0-concept-browser-validation
          path: release/browser-acceptance/
          retention-days: 14
  windows:
    needs: source
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native-build]'))
    runs-on: windows-2022
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build and inspect standalone native CPU runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare_windows_runtime.ps1
      - run: python build.py --target windows
      - run: go test ./...
      - run: go vet ./...
      - name: Actual app startup, setup and image generation
        run: python scripts/verify_image_runtime.py --binary release/ORIGIN0.exe --output release/windows-acceptance --timeout 2100
      - name: Package verified Windows release
        run: python scripts/package_release.py
      - name: Publish tested preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/origin0-concept-studio' && contains(github.event.head_commit.message, '[publish-release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.0 --target "$env:GITHUB_SHA" --title "ORIGIN-0 v1.6 — Concept Studio and internet relay (Windows preview)" --notes-file RELEASE_NOTES.md --draft --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; no assets were replaced' }
          gh release upload v1.6.0 release/ORIGIN0.exe release/ORIGIN0_WINDOWS_v1.6.zip release/SHA256SUMS.txt release/windows-acceptance/report.json release/windows-acceptance/image.png release/windows-acceptance/generation.log release/windows-acceptance/revision.png release/windows-acceptance/revision.log bundled/origin0-sd-d04e895-windows-amd64-cpu.zip model_catalog.json native-package/imports.txt
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains a draft' }
          gh release edit v1.6.0 --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: origin0-windows-validation
          path: |
            release/ORIGIN0.exe
            release/ORIGIN0_WINDOWS_v1.6.zip
            release/SHA256SUMS.txt
            release/windows-acceptance/
            bundled/origin0-sd-d04e895-windows-amd64-cpu.zip
            native-package/imports.txt
            model_catalog.json
          retention-days: 14
